modLoader="javafml"
loaderVersion="[4,)"
license="GPL-3.0-only"

[[mods]]
modId="autofish"
version="${mod_version}"
displayName="Auto Fish"
displayURL="https://github.com/troyhayes/autofish"
authors="troyhayes, ximu"
description='''
A configurable client-side automatic fishing mod for Minecraft 26.1.2,
ported from troyhayes/autofish with Aquaculture 2 support.
'''

[[mixins]]
config="autofish.client.mixins.json"

[[dependencies.autofish]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="CLIENT"

[[dependencies.autofish]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="CLIENT"

[[dependencies.autofish]]
modId="aquaculture"
type="optional"
versionRange="[2.9.2,)"
ordering="AFTER"
side="CLIENT"
