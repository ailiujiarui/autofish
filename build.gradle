plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.fabricmc.fabric-loom' version '1.17.17'
    id 'idea'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets.main {
    java.srcDir 'src/client/java'
    resources.srcDir 'src/client/resources'
}

loom {
    runs {
        client {
            client()
            runDir 'run-fabric'
            if (project.hasProperty('quickPlayWorld')) {
                programArgs '--quickPlaySingleplayer', project.property('quickPlayWorld').toString()
            }
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    def properties = [
            mod_version          : project.mod_version,
            minecraft_version    : project.minecraft_version,
            fabric_loader_version: project.fabric_loader_version
    ]
    inputs.properties(properties)
    filesMatching('fabric.mod.json') {
        expand(properties)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-Xlint:deprecation')
}

tasks.named('test') {
    useJUnitPlatform()
}

java {
    withSourcesJar()
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.name}" }
    }
    from('NOTICE') {
        rename { "${it}_${project.name}" }
    }
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            from components.java
        }
    }
}
